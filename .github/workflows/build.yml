name: Build kernel deb packages
on: 
  push:
  schedule:
    # * is a special character in YAML so you have to quote this string
    - cron:  '30 5 1 * *'
  workflow_dispatch:

jobs:
  build:
    name: Build kernel
    runs-on: ubuntu-22.04
    steps:
      - name: tmpfs
        run: |
          DIR="$(pwd)"
          [ -d "$DIR" ] || { echo "Error: pwd not exist"; exit 1; }
          cd / || cd /tmp
          sudo mount -t tmpfs tmpfs "$DIR" -o size=6G,mode=1777,noatime || { echo "mount failed"; exit 2; }
          cd "$DIR" || { echo "cd back failed"; exit 3; }
          df -h .   # 验证 tmpfs 是否生效

      - name: Checkout
        uses: actions/checkout@main
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: install dep
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq gpg python3-pyquery wget xz-utils make gcc flex bison dpkg-dev bc rsync kmod cpio libssl-dev git lsb vim libelf-dev neofetch python3-pip python3-tk debhelper zstd dpkg-sig mmdebstrap qemu-user-static usrmerge binfmt-support systemd-container

      - name: Build
        run: bash build_action.sh


      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: ${{ github.workspace }}/artifact/
          
      - name: Compare files
        id: compare
        run: |
          cmp --silent txt/longterm.txt /tmp/longterm.txt && cmp --silent txt/mainline.txt /tmp/mainline.txt && cmp --silent txt/stable.txt /tmp/stable.txt && echo "skip=true" >> $GITHUB_OUTPUT || echo "skip=false" >> $GITHUB_OUTPUT
      - name: Commit and Push Changes
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
        if: ${{ steps.compare.outputs.skip != 'true' }}
        run: |
          git config user.name "XXTXTOP"
          git config user.email "xxtxtop@gmail.com"
          ls -al
          pwd
          cp /tmp/mainline.txt  txt/mainline.txt
          cp /tmp/mainlineurl.txt txt/mainlineurl.txt
          cp /tmp/stable.txt txt/stable.txt 
          cp /tmp/stableurl.txt txt/stableurl.txt
          cp /tmp/longterm.txt txt/longterm.txt
          cp /tmp/longtermurl.txt txt/longtermurl.txt 
          git pull
          git add txt/
          git commit -m "Create file with kernel version"
          git push
